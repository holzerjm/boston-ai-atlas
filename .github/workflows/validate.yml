name: Validate atlas data

# Runs on every PR (no path filter) so "validate" can be a required status
# check in main's branch protection — a path-filtered required check never
# reports on PRs outside its paths and would block them forever.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "atlas-data.js", "package.json", "package-lock.json"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Validate data/ against the schemas
        run: node scripts/validate.js
      - name: Freshness report (informational, never fails the build)
        continue-on-error: true
        run: node scripts/stale.js >> "$GITHUB_STEP_SUMMARY"

  badge:
    # keep the entry-count badge in sync after merges to main
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Regenerate badge.json
        run: node scripts/badge.js
      - name: Commit badge if changed
        run: |
          if ! git diff --quiet badge.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add badge.json
            git commit -m "chore: update entry-count badge"
            # main may have moved while this job ran (another push, or a
            # human pushing right after a merge) — rebase and retry so the
            # badge commit isn't rejected as non-fast-forward
            for i in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            git push
          fi
