# Weekly events refresh — builds events.json (Boston AI events, next 10 days),
# ships it to /ecosystem/events.json, and posts the list to the TOA Scouts
# Slack. Target: Monday 7am Eastern, year-round.
#
# GitHub cron is best-effort: firings are often late (hours, at times) and
# occasionally dropped, worst at the top of the hour. So: three Monday firings
# at :07 past the hour, and a gate that lets through the FIRST one that is
# (a) at or after 7am Eastern and (b) sees a live events.json that has not
# been regenerated since 7am Eastern today. Late firings still run, dropped
# firings are covered by the next, extra firings skip. EDT/EST needs no
# special handling: the gate looks at the clock, not at which cron fired.
#
# Secrets: DEPLOY_* (shared with deploy.yml) ship the file;
# SLACK_SCOUTS_WEBHOOK_URL posts the list (skipped silently if unset).

name: Weekly events refresh

on:
  schedule:
    - cron: "7 11 * * 1"   # 7:07am EDT / 6:07am EST (gate skips before 7am)
    - cron: "7 12 * * 1"   # 8:07am EDT / 7:07am EST
    - cron: "7 13 * * 1"   # catch-up an hour later, in case both were dropped
  workflow_dispatch:
    inputs:
      check_gate:
        description: "Evaluate the cron gate instead of forcing a run (for testing)"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Gate (first firing at or after 7am Eastern that finds a stale live file)
        id: gate
        env:
          LIVE_URL: https://the-open-accelerator.com/ecosystem/events.json
          CHECK_GATE: ${{ github.event.inputs.check_gate }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "Gate: $2"; echo "**Gate:** $2" >> "$GITHUB_STEP_SUMMARY"; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CHECK_GATE" != "true" ]; then
            decide true "running (manual dispatch)"; exit 0
          fi
          NOW_ET=$(TZ=America/New_York date "+%Y-%m-%dT%H:%M:%S")
          HOUR=$(TZ=America/New_York date "+%-H")
          if [ "$HOUR" -lt 7 ]; then
            decide false "skipped — $NOW_ET Eastern is before 7am; a later firing covers this week"; exit 0
          fi
          GEN=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_URL?cb=$(date +%s)" | jq -r '.generated // empty' 2>/dev/null || true)
          GEN_ET=""
          if [ -n "$GEN" ]; then
            GEN_ET=$(TZ=America/New_York date -d "$GEN" "+%Y-%m-%dT%H:%M:%S" 2>/dev/null || true)
          fi
          TODAY7=$(TZ=America/New_York date "+%Y-%m-%dT07:00:00")
          if [ -n "$GEN_ET" ] && [[ "$GEN_ET" > "$TODAY7" || "$GEN_ET" == "$TODAY7" ]]; then
            decide false "skipped — live events.json already regenerated at $GEN_ET Eastern; this Monday's refresh is done"; exit 0
          fi
          if [ -n "$GEN_ET" ]; then
            decide true "running — $NOW_ET Eastern; live file last generated $GEN_ET Eastern"
          else
            decide true "running — $NOW_ET Eastern; could not read the live file, refreshing to be safe"
          fi

      - name: Fetch events
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/fetch-events.js | tee fetch.log
          { echo '## Events refresh'; echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Ship events.json
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" events.json \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Post to TOA Scouts Slack
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SLACK_SCOUTS_WEBHOOK_URL: ${{ secrets.SLACK_SCOUTS_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_SCOUTS_WEBHOOK_URL" ] && { echo "SLACK_SCOUTS_WEBHOOK_URL not set — skipping"; exit 0; }
          LIST=$(node -e '
            const j=require("./events.json");
            const tz={timeZone:"America/New_York"};
            const day=d=>new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric",...tz}).format(d);
            const tm=d=>new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",...tz}).format(d);
            let cur="", out=[];
            for(const e of j.events.slice(0,18)){
              const d=new Date(e.start), k=day(d);
              if(k!==cur){ out.push("*"+k+"*"); cur=k; }
              out.push("• "+tm(d)+" — <"+e.url+"|"+e.title.replace(/[<>|]/g," ")+">"+(e.organizer?" · "+e.organizer.replace(/[<>|]/g," "):""));
            }
            if(j.events.length>18) out.push("_… and "+(j.events.length-18)+" more on the page_");
            console.log(out.join("\n"));')
          COUNT=$(node -e 'console.log(require("./events.json").total)')
          WEEK=$(TZ=America/New_York date "+%B %-d")
          jq -n --arg list "$LIST" --arg count "$COUNT" --arg week "$WEEK" '
            {text: ("🗓️ Boston AI events, week of " + $week + " — " + $count + " in the next 10 days"),
             blocks: [
               {type:"header", text:{type:"plain_text", text:("🗓️ This week in Boston AI · " + $week), emoji:true}},
               {type:"section", text:{type:"mrkdwn", text:("*" + $count + " events in the next 10 days* — full list at <https://the-open-accelerator.com/ecosystem/events/|the-open-accelerator.com/ecosystem/events>")}},
               {type:"section", text:{type:"mrkdwn", text:$list}},
               {type:"context", elements:[{type:"mrkdwn", text:"Spot a missing event? Reply here or use the ➕ on the events page. Refreshed every Monday 7am."}]}
             ]}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_SCOUTS_WEBHOOK_URL"
