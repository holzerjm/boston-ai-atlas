$schema: http://json-schema.org/draft-07/schema#
$id: stages.schema.yml
title: Mass AI Atlas founder stages (STAGES)
description: The founder journey, in order.
type: array
minItems: 1
items:
  type: object
  required: [n, t, s, icon, desc, tips]
  additionalProperties: false
  properties:
    n:
      description: stage number, referenced by an entity's `stages`
      type: integer
      minimum: 1
    t:
      description: stage title
      type: string
      minLength: 1
    s:
      description: subtitle
      type: string
      minLength: 1
    icon:
      type: string
      minLength: 1
    desc:
      type: string
      minLength: 1
    tips:
      type: array
      items:
        description: "[title, text]"
        type: array
        items:
          - type: string
            minLength: 1
          - type: string
            minLength: 1
        minItems: 2
        additionalItems: false
